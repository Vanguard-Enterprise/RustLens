# Players-service cutover (Rust, D1 domain-prefix reorg). Routes the two path
# families the players service owns to it at a higher priority than the `/api`
# catch-all in base.yml; everything else still falls through to the Go backend.
#
# One PathPrefix per family:
#   - /api/internal/bot/players: the bot-internal player domain (Steam<->BM
#     resolution, profiles/analytics, all Steam<->Discord linking, guild
#     game-bans + nickname targets, track-group analytics, platform-sync).
#   - /api/app/players: the app-facing session-authed search + profile routes
#     the frontend/dashboard hits.
#
# The players service dual-registers the new `/api/internal/bot/players/...`
# prefix alongside the legacy flat `/api/internal/bot/setup/...` paths, so the
# bot deploy (which flips to these new paths) is the cutover moment for this
# domain. The legacy flat paths still route to Go via the base.yml catch-all
# until Phase E drops them.
http:
  routers:
    players:
      entryPoints:
        - web
      priority: 200
      service: players
      # Single line: Traefik's rule parser rejects embedded newlines.
      rule: "Host(`localhost`) && (PathPrefix(`/api/internal/bot/players`) || PathPrefix(`/api/app/players`))"

  services:
    players:
      loadBalancer:
        servers:
          - url: "http://players:8091"
