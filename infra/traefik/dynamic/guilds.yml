# Guilds-service cutover (Rust, D1 domain-prefix reorg). Routes the path
# families the guilds service owns to it at a higher priority than the `/api`
# catch-all in base.yml; everything else still falls through to the Go backend.
#
# One PathPrefix per family:
#   - /api/internal/bot/guilds: the bot-internal guild domain (guild settings,
#     wipe-reacts + schedules + schedule-post queue, track-groups, user-guilds,
#     bot-guilds sync, bot-user-installs).
#   - /api/app/admin/guilds: the admin guild list/detail routes.
#   - /api/app/admin/user-installs: the admin user-installs list route.
#
# The guilds service dual-registers the new `/api/internal/bot/guilds/...`
# prefix alongside the legacy flat `/api/internal/bot/setup/...` paths, so the
# bot deploy (which flips to these new paths) is the cutover moment for this
# domain. The legacy flat paths still route to Go via the base.yml catch-all
# until Phase E drops them.
http:
  routers:
    guilds:
      entryPoints:
        - web
      priority: 200
      service: guilds
      # Single line: Traefik's rule parser rejects embedded newlines.
      rule: "Host(`localhost`) && (PathPrefix(`/api/internal/bot/guilds`) || PathPrefix(`/api/app/admin/guilds`) || PathPrefix(`/api/app/admin/user-installs`))"

  services:
    guilds:
      loadBalancer:
        servers:
          - url: "http://guilds:8093"
