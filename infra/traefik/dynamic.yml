http:
  routers:
    api:
      entryPoints:
        - web
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      priority: 100
      service: backend

    frontend:
      entryPoints:
        - web
      rule: "Host(`localhost`)"
      service: frontend

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"

    frontend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"