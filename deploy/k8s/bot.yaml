apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: rustlens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/OWNER/rustlens-bot:main
          envFrom:
            - configMapRef:
                name: rustlens-config
            - secretRef:
                name: rustlens-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi