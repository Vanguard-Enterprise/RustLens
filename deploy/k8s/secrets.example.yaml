apiVersion: v1
kind: Secret
metadata:
  name: rustlens-secrets
  namespace: rustlens
type: Opaque
stringData:
  POSTGRES_URL: postgres://rustlens:replace_me@postgres.rustlens.svc.cluster.local:5432/rustlens?sslmode=disable
  REDIS_URL: redis://redis.rustlens.svc.cluster.local:6379/0
  BOT_SERVICE_JWT_SECRET: replace-me
  DISCORD_TOKEN: replace-me