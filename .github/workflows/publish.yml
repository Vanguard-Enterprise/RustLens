name: Publish Images

on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - { service: backend, context: ., file: apps/backend/Dockerfile }
          - { service: frontend, context: ., file: apps/frontend/Dockerfile }
          - { service: bot, context: ., file: apps/bot/Dockerfile }
          - { service: identity, context: apps/rust, file: apps/rust/Dockerfile }
          - { service: players, context: apps/rust, file: apps/rust/Dockerfile }
          - { service: servers, context: apps/rust, file: apps/rust/Dockerfile }
          - { service: guilds, context: apps/rust, file: apps/rust/Dockerfile }
          - { service: coordinator, context: apps/rust, file: apps/rust/Dockerfile }
          - { service: migrate, context: apps/rust, file: apps/rust/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image owner
        id: image_owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: |
            DEPLOYMENT_VERSION=sha-${{ github.sha }}
            SERVICE=${{ matrix.service }}
          secrets: |
            next_server_actions_encryption_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.value }}/rustlens-${{ matrix.service }}:main
            ghcr.io/${{ steps.image_owner.outputs.value }}/rustlens-${{ matrix.service }}:sha-${{ github.sha }}
