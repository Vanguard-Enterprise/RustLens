name: Publish Images

on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, bot]
    steps:
      - uses: actions/checkout@v6

      - name: Normalize image owner
        id: image_owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.value }}/rustlens-${{ matrix.service }}:main
            ghcr.io/${{ steps.image_owner.outputs.value }}/rustlens-${{ matrix.service }}:sha-${{ github.sha }}
