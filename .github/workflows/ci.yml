name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workspace:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
  rust:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rustlens
          POSTGRES_USER: rustlens
          POSTGRES_PASSWORD: rustlens
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U rustlens"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run migrations
        run: cargo run --bin migrate
        env:
          POSTGRES_URL: postgres://rustlens:rustlens@172.18.0.1:${{ job.services.postgres.ports['5432'] }}/rustlens?sslmode=disable

      - name: Test
        run: cargo test
        env:
          RUSTLENS_TEST_PG_URL: postgres://rustlens:rustlens@172.18.0.1:${{ job.services.postgres.ports['5432'] }}/rustlens?sslmode=disable
