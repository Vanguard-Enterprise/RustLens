name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  javascript:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu
      - vanguard-enterprise
      - ve-runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu
      - vanguard-enterprise
      - ve-runner
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/server

  manifests:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ubuntu
      - vanguard-enterprise
      - ve-runner
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f deploy/k8s
