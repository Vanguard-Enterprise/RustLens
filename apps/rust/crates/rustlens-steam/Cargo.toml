[package]
name = "rustlens-steam"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Steam Web API client + Steam<->BattleMetrics resolver chain (bmsearch primary, bmmatch fallback) + platformsync client for RustLens Rust services. All upstreams are called directly (never proxied)."

