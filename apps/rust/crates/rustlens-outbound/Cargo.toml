[package]
name = "rustlens-outbound"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Outbound HTTP proxy provider (round-robin rotation, per-proxy health window, auto-disable) for RustLens Rust services, mirroring the Go outboundhttp package. Only BattleMetrics traffic is proxied."

[dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }
rustlens-crypto = { workspace = true }
rustlens-db = { workspace = true }
