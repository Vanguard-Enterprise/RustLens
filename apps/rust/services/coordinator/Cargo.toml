[package]
name = "coordinator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RustLens coordinator service — bot shard coordination (Redis leases), owner stats, rate-limit consume, Discord webhook events, and the cleanup retention sweep. Shares the same Postgres + Redis as the Go backend."

