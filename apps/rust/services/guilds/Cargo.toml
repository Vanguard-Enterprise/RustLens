[package]
name = "guilds"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "RustLens guilds service — guild settings, wipe-reacts + schedules + scheduler, track-groups, guild/user/install sync, and admin guild list/detail. Talks to the same Postgres as the Go backend."

